name: Android app

# Builds the Flutter app in android_app/ and runs its tests. The debug APK is attached to the run.
on:
  push:
    paths:
      - android_app/**
      - .github/workflows/android-app.yml
  pull_request:
    paths:
      - android_app/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the Android project files
        run: python3 ../scripts/ci_annotate.py ./setup.sh
      - name: Analyze
        run: python3 ../scripts/ci_annotate.py flutter analyze
      - name: Tests
        run: python3 ../scripts/ci_annotate.py flutter test
      - name: Build APK
        run: python3 ../scripts/ci_annotate.py flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: file-rescue-debug-apk
          path: android_app/build/app/outputs/flutter-apk/app-debug.apk
