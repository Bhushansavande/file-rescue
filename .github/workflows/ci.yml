name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: CLI smoke test
        run: |
          filerescue --version
          filerescue types
      - name: Unit tests
        run: python scripts/ci_annotate.py python -m unittest discover -s tests -v

  real-media:
    name: real media and undelete on real file systems
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          APT='-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends ffmpeg mtools dosfstools e2fsprogs ntfs-3g exfat-fuse exfatprogs
          python -m pip install pillow pillow-heif py7zr
      - name: Recover real files from real file systems
        run: python scripts/realworld_test.py
      - name: Undelete with names on FAT32, exFAT and NTFS
        run: python scripts/realworld_fs_test.py
