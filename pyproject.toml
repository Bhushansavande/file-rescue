[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "file-rescue"
version = "0.1.0"
description = "डिलीट झालेले फोटो, व्हिडिओ, गाणी, APK परत मिळवणारे मोफत ओपन-सोर्स टूल (Windows/Linux/Android)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Bhushan Savande (Life Style Knowledge Hub)" }]
keywords = ["data-recovery", "file-carving", "undelete", "android", "marathi"]
dependencies = []

[project.scripts]
filerescue = "filerescue.cli:main"

[tool.setuptools]
packages = ["filerescue"]
