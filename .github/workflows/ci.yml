name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: CLI smoke test
        run: |
          filerescue --version
          filerescue types
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  real-media:
    name: real media on FAT32 and ext4 images
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mtools dosfstools e2fsprogs
          python -m pip install pillow
      - name: Recover real files from real file systems
        run: python scripts/realworld_test.py
